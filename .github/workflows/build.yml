# 测试，以及打包 Windows、macOS 和 Linux 安装包。
# - 推送分支、提交 PR：只跑测试
# - 在 Actions 页面手动运行：测试并打包，安装包在这次运行的 Artifacts 里下载
# - 推送 v 开头的标签（例如 v0.1.0）：测试并打包，全部成功后发布一个 Release，附上安装包和自动更新用的 latest.json
name: 打包

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 测试 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: cargo test -p tooltree-core --no-fail-fast
      - run: npm test
      - run: npm run check

  build:
    name: 打包 (${{ matrix.name }})
    # 平时推代码只跑测试，打包很慢，只在发版和手动运行时做
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            files: |
              target/release/bundle/msi/*.msi
              target/release/bundle/nsis/*.exe
              target/release/bundle/nsis/*.exe.sig
          - name: macOS (Apple 芯片)
            os: macos-latest
            arch: aarch64
            files: |
              target/release/bundle/dmg/*.dmg
              target/release/bundle/macos/*.app.tar.gz*
          - name: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
            arch: x64
            files: |
              target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
              target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz*
          # 截图库 xcap 依赖的 libspa 要用 PipeWire 1.0 以上的头文件编译，22.04 自带的 0.3.48 太老，
          # 所以用 24.04 打包。代价是 glibc 2.39，比 Ubuntu 24.04 / Debian 13 / Fedora 40 更老的发行版跑不了
          - name: Linux
            os: ubuntu-24.04
            arch: linux
            files: |
              target/release/bundle/deb/*.deb*
              target/release/bundle/rpm/*.rpm*
              target/release/bundle/appimage/*.AppImage*
    runs-on: ${{ matrix.os }}
    env:
      # 自动更新包的签名私钥，在仓库 Settings → Secrets and variables → Actions 里配置
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # macOS 代码签名证书（自签名的 .p12，base64 编码）和它的密码。
      # 没有固定的签名时，系统按程序文件的哈希认应用，每个版本都不一样，
      # 用户给的“录屏”“辅助功能”权限一更新就失效。不用 APPLE_CERTIFICATE 这个名字：
      # Tauri 看到它会自己导入，而它只认苹果开发者证书
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      # 版本号不一致时，装好的新版本会以为自己还是旧版本，自动更新会一直提示，所以发版前先检查
      - name: 检查版本号
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: python3 .github/scripts/check_version.py "$GITHUB_REF_NAME"
      # 发版时必须有签名私钥，否则这个版本没有更新包，已经装了的用户收不到更新
      - name: 检查签名私钥
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::仓库的 Secrets 里没有配置 TAURI_SIGNING_PRIVATE_KEY，发版需要它来给自动更新包签名"
            exit 1
          fi
          if [ "$RUNNER_OS" = macOS ] && [ -z "$MACOS_CERTIFICATE" ]; then
            echo "::error::仓库的 Secrets 里没有配置 MACOS_CERTIFICATE，没有它用户每次更新后都要重新授权录屏和辅助功能"
            exit 1
          fi
      - name: 安装 Linux 依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # webkit、gtk 是界面，appindicator 是托盘图标，xdo 用来模拟粘贴键，xcb、pipewire 等是截图（xcap）要的
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev \
            libdbus-1-dev libxdo-dev libxcb1-dev libxrandr-dev libpipewire-0.3-dev libwayland-dev libegl-dev libgbm-dev \
            libclang-dev pkg-config patchelf file
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: npm ci
      # 把证书导入一个临时钥匙串，用证书指纹签名。自签名证书系统不信任，按名字找不到，按指纹可以
      - name: 导入 macOS 签名证书
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE != ''
        run: |
          kc="$RUNNER_TEMP/sign.keychain-db"
          security create-keychain -p ci "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p ci "$kc"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          id=$(security find-identity -p codesigning "$kc" | awk '/^ *1\)/ {print $2; exit}')
          [ -n "$id" ] || { echo "::error::证书里没有找到签名身份"; exit 1; }
          echo "APPLE_SIGNING_IDENTITY=$id" >> "$GITHUB_ENV"
      - name: 打包
        shell: bash
        run: |
          args=()
          [ -n "${{ matrix.target }}" ] && args+=(--target "${{ matrix.target }}")
          # 有私钥时同时生成签过名的更新包；手动运行又没配置私钥时只打普通安装包
          [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && args+=(--config src-tauri/tauri.updater.conf.json)
          npx tauri build "${args[@]}"
      - name: 检查 macOS 签名
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE != ''
        shell: bash
        run: |
          app=$(ls -d target/${{ matrix.target }}/release/bundle/macos/*.app | head -1)
          codesign --verify --deep --strict "$app"
          codesign -d -r- "$app" 2>&1 | tee /dev/stderr | grep -q "certificate leaf"
      # 两种 Mac 的更新包默认同名，上传到同一个 Release 会互相覆盖，按架构改名
      - name: 更新包按架构改名
        if: runner.os == 'macOS'
        shell: bash
        run: |
          dir="target/${{ matrix.target }}/release/bundle/macos"
          if [ -f "$dir/ToolTree.app.tar.gz" ]; then
            mv "$dir/ToolTree.app.tar.gz" "$dir/ToolTree_${{ matrix.arch }}.app.tar.gz"
            mv "$dir/ToolTree.app.tar.gz.sig" "$dir/ToolTree_${{ matrix.arch }}.app.tar.gz.sig"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ToolTree-${{ matrix.arch || 'windows' }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    name: 发布 Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # 每个平台的安装包下载下来会带着 dmg/、nsis/ 这样的子目录，放到同一层才能上传
      - name: 把安装包放到同一层
        run: |
          find dist -mindepth 2 -type f -exec mv -t dist {} +
          find dist -mindepth 1 -type d -empty -delete
      # 已安装的 ToolTree 从 releases/latest/download/latest.json 检查更新，没有它就收不到更新，生成失败时整个发布失败
      - name: 生成自动更新用的 latest.json
        run: |
          prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          git log --no-merges --format='- %s' ${prev:+$prev..}"$GITHUB_REF_NAME" \
            | python3 .github/scripts/latest_json.py dist "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" > dist/latest.json
          cat dist/latest.json
          python3 - <<'PY'
          import json
          d = json.load(open("dist/latest.json"))
          missing = {"darwin-aarch64", "darwin-x86_64", "windows-x86_64", "linux-x86_64"} - set(d["platforms"])
          if missing:
              raise SystemExit(f"latest.json 缺少这些平台的更新包：{sorted(missing)}")
          PY
      - run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          name: ToolTree ${{ github.ref_name }}
          body_path: .github/release-notes.md
          generate_release_notes: true
          files: dist/*
