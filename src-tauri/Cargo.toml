[package]
name = "tooltree"
version = "0.1.6"
description = "开发者工具箱：常用开发工具、剪贴板历史"
edition = "2024"
license = "Apache-2.0"

[lib]
name = "tooltree_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tooltree-core = { path = "../crates/tooltree-core" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde.workspace = true
serde_json.workspace = true
arboard = { version = "3.7", features = ["image-data"] }
# 选中历史记录后模拟按下粘贴键
enigo = "0.6"
xcap = "0.9"
image = { version = "0.25", default-features = false, features = ["png"] }
# 截图保存的默认文件名用本地时间
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# 翻译：调用各家的接口和签名
ureq = { version = "2", features = ["json"] }
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_DataExchange", "Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }
