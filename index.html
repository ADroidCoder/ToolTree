<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ToolTree</title>
    <script>
      // 在页面渲染前设置主题和底色，避免启动时白屏。默认深色
      (function () {
        var theme = "dark";
        try {
          theme = localStorage.getItem("tooltree.theme") || "dark";
        } catch (e) {}
        var root = document.documentElement;
        root.dataset.theme = theme;
        var light = theme === "light" || (theme === "system" && !matchMedia("(prefers-color-scheme: dark)").matches);
        root.style.background = light ? "#f8f9fb" : "#1c1e23";
        root.style.colorScheme = light ? "light" : "dark";
      })();
    </script>
    <style>
      /* 脚本加载完之前显示的启动画面，界面挂载后移除 */
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        color: #8b93a1;
        font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      #boot .spin {
        width: 22px;
        height: 22px;
        border: 2px solid rgba(139, 147, 161, 0.25);
        border-top-color: #4d8ef7;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      /* 剪贴板面板一闪而过，不显示启动文字 */
      .panel #boot .name {
        display: none;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="boot"><div class="spin"></div><span class="name">ToolTree</span></div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
